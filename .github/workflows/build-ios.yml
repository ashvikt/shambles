name: Build iPhone app

on:
  push:
    branches: [main]
    paths:
      - "ios/**"
      - ".github/workflows/build-ios.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-ios
  cancel-in-progress: true

jobs:
  build:
    name: Build Shambles.ipa
    runs-on: xcode-27
    steps:
      - name: Fetch source
        uses: actions/checkout@v6

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "27.1"

      - name: Build
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild clean archive \
            -project StikDebug.xcodeproj \
            -scheme "StikDebug" \
            -configuration Debug \
            -archivePath build/Shambles.xcarchive \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            SWIFT_OPTIMIZATION_LEVEL="-Onone" \
            IPHONEOS_DEPLOYMENT_TARGET=17.4 2>&1 | tee build.log | grep -E "error:|warning: unre|\*\* ARCHIVE|^(Compile|Link|Archive)" || true
          grep -q "ARCHIVE SUCCEEDED" build.log || { echo "---- errors ----"; grep -n "error" build.log | head -80; tail -40 build.log; exit 1; }

      - name: Package .ipa
        working-directory: ios
        run: |
          mkdir Payload
          cp -R build/Shambles.xcarchive/Products/Applications/*.app Payload/
          zip -qr ../Shambles.ipa Payload
          ls -la ../Shambles.ipa

      - name: Keep the .ipa with this run
        uses: actions/upload-artifact@v7
        with:
          name: Shambles-ipa
          path: Shambles.ipa
          retention-days: 30

      - name: Publish as the latest download
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest Shambles.ipa \
            --target "$GITHUB_SHA" \
            --title "Shambles for iPhone (latest build)" \
            --notes "Unsigned build ${GITHUB_SHA::7}. Install it with SideStore. Setup steps are in the README."
